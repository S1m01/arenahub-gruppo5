<header class="navbar">
  <div class="riga-alta">
    <a routerLink="/" class="logo" aria-label="Lazio Digital - torna alla home">
      <img src="logo-laziodigital.png" alt="Lazio Digital ITS Academy" />
    </a>

    <div class="azioni">
      @if (auth.loggato()) {
        <span class="saluto">Ciao, {{ auth.utente()?.nome ?? 'utente' }}</span>
        <button type="button" class="btn-outline" (click)="esci()">Esci</button>
      } @else {
        <a routerLink="/login" class="btn-pieno">Login</a>
      }
    </div>
  </div>

  <nav class="menu" aria-label="Menu principale">
    <ul class="barra">
      <li class="con-tendina">
        <button
          type="button"
          class="voce attiva-possibile"
          [class.attiva]="sezioneTornei()"
          [attr.aria-expanded]="tendinaAperta()"
          aria-haspopup="true"
          (click)="apriChiudiTendina($event)"
        >
          Tornei <span class="freccia" aria-hidden="true">▾</span>
        </button>

        @if (tendinaAperta()) {
          <ul class="tendina" role="menu">
            <li role="none">
              <a
                role="menuitem"
                routerLink="/"
                routerLinkActive="corrente"
                [routerLinkActiveOptions]="{ exact: true }"
                (click)="chiudiTendina()"
                >Tornei aperti</a
              >
            </li>
            <li role="none">
              <a
                role="menuitem"
                routerLink="/tornei-chiusi"
                routerLinkActive="corrente"
                (click)="chiudiTendina()"
                >Tornei chiusi</a
              >
            </li>
          </ul>
        }
      </li>

      @for (voce of vociFuture; track voce.label) {
        <li>
          <span class="voce" aria-disabled="true" title="Presto disponibile">
            {{ voce.label }}
            @if (voce.tendina) {
              <span class="freccia" aria-hidden="true">▾</span>
            }
          </span>
        </li>
      }
    </ul>
  </nav>
</header>
