<section class="pagina">
  <form class="scheda-modulo" [formGroup]="form" (ngSubmit)="accedi()" novalidate>
    <h1>Login</h1>

    <div class="corpo">
      @if (erroreServer()) {
        <p class="msg-errore" role="alert">{{ erroreServer() }}</p>
      }

      <label class="etichetta-campo">
        Email
        <input
          type="email"
          class="campo"
          formControlName="email"
          autocomplete="email"
          [class.errore]="campoNonValido('email')"
        />
        @if (campoNonValido('email')) {
          <small class="errore-campo">
            {{ form.controls.email.hasError('required') ? 'Inserisci la tua email' : 'Email non valida' }}
          </small>
        }
      </label>

      <label class="etichetta-campo">
        Password
        <input
          type="password"
          class="campo"
          formControlName="password"
          autocomplete="current-password"
          [class.errore]="campoNonValido('password')"
        />
        @if (campoNonValido('password')) {
          <small class="errore-campo">Inserisci la password</small>
        }
      </label>

      <button type="submit" class="btn btn-primario btn-largo" [disabled]="invio()">
        {{ invio() ? 'Accesso in corso...' : 'Login' }}
      </button>

      <p class="sotto">Non hai un account? <a routerLink="/registrazione">Registrati</a></p>
    </div>
  </form>
</section>
