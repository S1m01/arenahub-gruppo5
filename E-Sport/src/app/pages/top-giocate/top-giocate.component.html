<section class="pagina">
  <h1 class="titolo">Top giocate</h1>

  <div class="filtri">
    <label class="filtro">
      <span>Torneo</span>
      <select class="campo" [value]="torneo()" (change)="torneo.set(valore($event))">
        <option value="TUTTI">Tutti</option>
        @for (t of tornei(); track t.id) {
          <option [value]="t.id">{{ t.nome }}</option>
        }
      </select>
    </label>

    <label class="filtro">
      <span>Categoria</span>
      <select class="campo" [value]="categoria()" (change)="scegliCategoria(valore($event))">
        <option value="TUTTE">Tutte</option>
        @for (c of categorie(); track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </label>
  </div>

  @if (caricamento()) {
    <p class="messaggio">Caricamento giocate...</p>
  } @else if (errore()) {
    <p class="messaggio errore">{{ errore() }}</p>
  } @else if (giocateFiltrate().length === 0) {
    <p class="messaggio">Nessuna giocata per i filtri scelti.</p>
  } @else {
    <div class="griglia">
      @for (g of giocateFiltrate(); track g.id) {
        <app-card-giocata [giocata]="g" />
      }
    </div>
  }
</section>
