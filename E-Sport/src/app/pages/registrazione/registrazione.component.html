<section class="pagina centrata">
  <form class="scheda" [formGroup]="form" (ngSubmit)="registrati()" novalidate>
    <h1 class="intestazione">Registrati</h1>

    <div class="corpo">
      <div class="griglia">
        <label class="campo-gruppo">
          <span>Nome</span>
          <input
            type="text"
            class="campo"
            formControlName="nome"
            autocomplete="given-name"
            [class.non-valido]="campoNonValido('nome')"
          />
          @if (campoNonValido('nome')) {
            <small class="errore-campo">{{ messaggioErrore('nome') }}</small>
          }
        </label>

        <label class="campo-gruppo">
          <span>Cognome</span>
          <input
            type="text"
            class="campo"
            formControlName="cognome"
            autocomplete="family-name"
            [class.non-valido]="campoNonValido('cognome')"
          />
          @if (campoNonValido('cognome')) {
            <small class="errore-campo">{{ messaggioErrore('cognome') }}</small>
          }
        </label>

        <label class="campo-gruppo">
          <span>Email</span>
          <input
            type="email"
            class="campo"
            formControlName="email"
            autocomplete="email"
            [class.non-valido]="campoNonValido('email')"
          />
          @if (campoNonValido('email')) {
            <small class="errore-campo">{{ messaggioErrore('email') }}</small>
          }
        </label>

        <label class="campo-gruppo">
          <span>Password</span>
          <input
            type="password"
            class="campo"
            formControlName="password"
            autocomplete="new-password"
            [class.non-valido]="campoNonValido('password')"
          />
          @if (campoNonValido('password')) {
            <small class="errore-campo">{{ messaggioErrore('password') }}</small>
          }
        </label>
      </div>

      <button type="submit" class="btn-pieno invia" [disabled]="invio()">
        {{ invio() ? 'Registrazione in corso...' : 'Registrati' }}
      </button>

      <p class="gia-registrato">
        Hai già un account? <a routerLink="/login">Login</a>
      </p>

      @if (erroreServer()) {
        <p class="errore-server" role="alert">{{ erroreServer() }}</p>
      }
    </div>
  </form>
</section>
