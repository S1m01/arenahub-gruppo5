<section class="pagina">
  <a routerLink="/profilo" class="indietro">‹ Profilo</a>

  @if (caricamento()) {
    <p class="caricamento">Caricamento profilo...</p>
  } @else if (errore()) {
    <p class="msg-errore">{{ errore() }}</p>
  } @else {
    <div class="griglia-due">
      <form class="scheda-modulo" [formGroup]="profilo" (submit)="$event.preventDefault(); salvaProfilo()" novalidate>
        <h1>Modifica profilo</h1>
        <div class="corpo">
          <label class="etichetta-campo">
            Nome
            <input class="campo" formControlName="nome" [class.errore]="nonValido(profilo, 'nome')" />
            @if (nonValido(profilo, 'nome')) {
              <small class="errore-campo">Il nome è obbligatorio</small>
            }
          </label>

          <label class="etichetta-campo">
            Cognome
            <input class="campo" formControlName="cognome" [class.errore]="nonValido(profilo, 'cognome')" />
            @if (nonValido(profilo, 'cognome')) {
              <small class="errore-campo">Il cognome è obbligatorio</small>
            }
          </label>

          <label class="etichetta-campo">
            Email
            <input
              type="email"
              class="campo"
              formControlName="email"
              [class.errore]="nonValido(profilo, 'email')"
            />
            @if (nonValido(profilo, 'email')) {
              <small class="errore-campo">Inserisci un'email valida</small>
            }
          </label>

          @if (esitoProfilo(); as e) {
            <p [class]="e.ok ? 'msg-ok' : 'msg-errore'" role="status">{{ e.testo }}</p>
          }

          <div class="fila-pulsanti">
            <button type="submit" class="btn btn-primario" [disabled]="invioProfilo()">
              {{ invioProfilo() ? 'Salvataggio...' : 'Salva' }}
            </button>
            <a routerLink="/profilo" class="btn btn-contorno">Annulla</a>
          </div>
        </div>
      </form>

      <form
        id="password"
        class="scheda-modulo"
        [formGroup]="password"
        (submit)="$event.preventDefault(); cambiaPassword()"
        novalidate
      >
        <h2>Cambia password</h2>
        <div class="corpo">
          <label class="etichetta-campo">
            Password attuale
            <input
              type="password"
              class="campo"
              formControlName="passwordAttuale"
              autocomplete="current-password"
              [class.errore]="nonValido(password, 'passwordAttuale')"
            />
            @if (nonValido(password, 'passwordAttuale')) {
              <small class="errore-campo">Inserisci la password attuale</small>
            }
          </label>

          <label class="etichetta-campo">
            Nuova password
            <input
              type="password"
              class="campo"
              formControlName="passwordNuova"
              autocomplete="new-password"
              [class.errore]="nonValido(password, 'passwordNuova')"
            />
            @if (nonValido(password, 'passwordNuova')) {
              <small class="errore-campo">La nuova password deve avere da 8 a 72 caratteri</small>
            }
          </label>

          @if (esitoPassword(); as e) {
            <p [class]="e.ok ? 'msg-ok' : 'msg-errore'" role="status">{{ e.testo }}</p>
          }

          <button type="submit" class="btn btn-primario btn-largo" [disabled]="invioPassword()">
            {{ invioPassword() ? 'Salvataggio...' : 'Cambia password' }}
          </button>
        </div>
      </form>
    </div>
  }
</section>
