<section class="pagina">
  <a routerLink="/profilo" class="indietro">‹ Profilo</a>

  @if (caricamento()) {
    <p class="messaggio">Caricamento profilo...</p>
  } @else if (errore()) {
    <p class="messaggio errore">{{ errore() }}</p>
  } @else {
    <div class="griglia">
      <form class="scheda" [formGroup]="profilo" (submit)="$event.preventDefault(); salvaProfilo()" novalidate>
        <h1 class="intestazione">Modifica profilo</h1>
        <div class="corpo">
          <label class="campo-gruppo">
            <span>Nome</span>
            <input class="campo" formControlName="nome" [class.non-valido]="nonValido(profilo, 'nome')" />
            @if (nonValido(profilo, 'nome')) {
              <small class="errore-campo">Il nome è obbligatorio</small>
            }
          </label>

          <label class="campo-gruppo">
            <span>Cognome</span>
            <input class="campo" formControlName="cognome" [class.non-valido]="nonValido(profilo, 'cognome')" />
            @if (nonValido(profilo, 'cognome')) {
              <small class="errore-campo">Il cognome è obbligatorio</small>
            }
          </label>

          <label class="campo-gruppo">
            <span>Email</span>
            <input
              type="email"
              class="campo"
              formControlName="email"
              [class.non-valido]="nonValido(profilo, 'email')"
            />
            @if (nonValido(profilo, 'email')) {
              <small class="errore-campo">Inserisci un'email valida</small>
            }
          </label>

          @if (esitoProfilo(); as e) {
            <p class="esito" [class.ok]="e.ok" role="status">{{ e.testo }}</p>
          }

          <div class="azioni">
            <button type="submit" class="btn-pieno" [disabled]="invioProfilo()">
              {{ invioProfilo() ? 'Salvataggio...' : 'Salva' }}
            </button>
            <a routerLink="/profilo" class="btn-outline">Annulla</a>
          </div>
        </div>
      </form>

      <form
        id="password"
        class="scheda"
        [formGroup]="password"
        (submit)="$event.preventDefault(); cambiaPassword()"
        novalidate
      >
        <h2 class="intestazione">Cambia password</h2>
        <div class="corpo">
          <label class="campo-gruppo">
            <span>Password attuale</span>
            <input
              type="password"
              class="campo"
              formControlName="passwordAttuale"
              autocomplete="current-password"
              [class.non-valido]="nonValido(password, 'passwordAttuale')"
            />
            @if (nonValido(password, 'passwordAttuale')) {
              <small class="errore-campo">Inserisci la password attuale</small>
            }
          </label>

          <label class="campo-gruppo">
            <span>Nuova password</span>
            <input
              type="password"
              class="campo"
              formControlName="passwordNuova"
              autocomplete="new-password"
              [class.non-valido]="nonValido(password, 'passwordNuova')"
            />
            @if (nonValido(password, 'passwordNuova')) {
              <small class="errore-campo">Inserisci la nuova password</small>
            }
          </label>

          @if (esitoPassword(); as e) {
            <p class="esito" [class.ok]="e.ok" role="status">{{ e.testo }}</p>
          }

          <button type="submit" class="btn-pieno" [disabled]="invioPassword()">
            {{ invioPassword() ? 'Salvataggio...' : 'Cambia password' }}
          </button>
        </div>
      </form>
    </div>
  }
</section>
