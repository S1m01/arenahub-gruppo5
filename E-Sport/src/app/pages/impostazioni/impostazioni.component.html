<section class="pagina">
  <a routerLink="/admin" class="indietro">‹ Gestione tornei</a>

  @if (caricamento()) {
    <p class="caricamento">Caricamento impostazioni...</p>
  } @else if (errore()) {
    <p class="msg-errore">{{ errore() }}</p>
  } @else {
    <form class="scheda-modulo" (submit)="$event.preventDefault(); salva()" novalidate>
      <h1>Impostazioni</h1>
      <div class="corpo">
        <label class="etichetta-campo">
          Numero massimo di tornei attivi per utente
          <input
            type="number"
            class="campo"
            min="1"
            max="3"
            step="1"
            [formControl]="limite"
            [class.errore]="limite.invalid && limite.touched"
          />
          @if (limite.invalid && limite.touched) {
            <small class="errore-campo">Il limite deve essere un numero intero da 1 a 3</small>
          } @else {
            <small class="aiuto">
              Quanti tornei aperti o chiusi (non conclusi) può avere ogni utente, come capitano o
              componente. Vale solo per le nuove iscrizioni: chi è già iscritto non viene tolto.
            </small>
          }
        </label>

        @if (esito(); as e) {
          <p [class]="e.ok ? 'msg-ok' : 'msg-errore'" role="status">{{ e.testo }}</p>
        }

        <div class="fila-pulsanti">
          <button type="submit" class="btn btn-primario" [disabled]="invio()">
            {{ invio() ? 'Salvataggio...' : 'Salva' }}
          </button>
          <a routerLink="/admin" class="btn btn-contorno">Annulla</a>
        </div>
      </div>
    </form>
  }
</section>
